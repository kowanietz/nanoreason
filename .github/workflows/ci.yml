name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check src scripts tests notebooks/utils
      - run: uv run --no-sync yamllint configs
