# @package _global_

defaults:
  - /common
  - _self_

model:
  name_or_path: ${paths.root}/checkpoints/reasoning-posttraining/sft/dolci-16k-repetition-3k2
  tokenizer_name_or_path: ${paths.root}/models/Olmo-3-7B-Think-SFT
  trust_remote_code: false
  attention_implementation: sdpa

data:
  directory: ${paths.repo}/.cache/rlvr-prepared-v3
  exclusions: ${paths.repo}/configs/eval/exclusions.json
  max_prompt_tokens: 512
  max_examples: 32
  selection_seed: 73

grpo:
  output_dir: ${paths.root}/checkpoints/reasoning-posttraining/rlvr/dr-grpo-smoke-8k
  max_steps: 8
  seed: 73
  learning_rate: 1.0e-6
  lr_scheduler_type: constant
  warmup_steps: 0
  weight_decay: 0.0
  max_grad_norm: 1.0
  optim: adamw_torch
  bf16: true

  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false

  fsdp: true
  fsdp_config:
    version: 2
    reshard_after_forward: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: [Olmo3DecoderLayer]
    activation_checkpointing: false
    state_dict_type: SHARDED_STATE_DICT
    cpu_offload: false

  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  generation_batch_size: 4
  num_generations: 4
  num_iterations: 1

  loss_type: dr_grpo
  scale_rewards: none
  beta: 0.0
  temperature: 1.0
  max_completion_length: 16384

  use_vllm: true
  vllm_mode: colocate
  vllm_model_impl: transformers
  vllm_enable_sleep_mode: true
  vllm_tensor_parallel_size: 4
  vllm_gpu_memory_utilization: 0.20
  vllm_max_model_length: 16896
  vllm_importance_sampling_correction: true

  remove_unused_columns: false
  use_liger_kernel: false
  torch_compile: false

  logging_steps: 1
  logging_nan_inf_filter: false
  log_completions: true
  num_completions_to_print: 4
  report_to: none

  save_strategy: steps
  save_steps: 4
  save_total_limit: 2
  save_only_model: false
  ignore_data_skip: false

  dataloader_num_workers: 0
  dataloader_drop_last: true
  disable_tqdm: true

runtime:
  validate_only: false
  expected_world_size: 4
  resume_from_checkpoint: auto
  stop_after_step: null
  stop_after_minutes: 90
