# @package _global_

defaults:
  - /common
  - _self_

olmes_project: ${oc.env:OLMES_PROJECT,${paths.root}/olmes}

model_type: vllm
model_args:
  trust_remote_code: false
  dtype: bfloat16
  tokenizer: ${paths.root}/models/Olmo-3-7B-Think-SFT
  max_length: 32768
batch_size: auto
gpus: 4
num_workers: 1
