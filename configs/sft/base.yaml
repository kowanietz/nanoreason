# @package _global_

defaults:
  - /common
  - _self_

model:
  load_dtype: auto
  name_or_path: /p/scratch/rcfd/kowanietz1/models/Olmo-3-7B
  tokenizer_name_or_path: /p/scratch/rcfd/kowanietz1/models/Olmo-3-7B-Think-SFT
  trust_remote_code: true
  attention_implementation: sdpa

data:
  path: /p/scratch/rcfd/kowanietz1/datasets/Dolci-Think-SFT-7B/data/*.parquet
  max_length: 16384
  overlength_strategy: drop
  packing: true
  shuffle: true
  num_proc: 8

training:
  precision: bf16
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  per_device_batch_size: 1
  gradient_accumulation_steps: 1
  resume_from_checkpoint: null
  gradient_checkpointing: true
  use_cache: false
  seed: 73

distributed:
  strategy: fsdp
  fsdp_sharding: full_shard

logging:
  logging_steps: 10
  save_steps: 100
  save_total_limit: 2
  report_to: none
