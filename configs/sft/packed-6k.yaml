# @package _global_

defaults:
  - /sft/base
  - _self_

experiment:
  name: dolci-16k-packed-6k

data:
  packing_batch_size: 256
  max_examples: 100000
  require_single_pass: true

training:
  output_dir: ${paths.root}/checkpoints/reasoning-posttraining/sft/dolci-16k-packed-6k
  learning_rate: 1.5e-5
  max_steps: 6000
  resume_from_checkpoint: auto
  stop_after_minutes: 1410
  enable_jit_checkpoint: true
  export_final_model: true

logging:
  save_steps: 200
