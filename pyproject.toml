[project]
name = "reasoning-posttraining"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "datasets>=5.0.1",
    "hydra-core>=1.3.2,<1.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
sft = [
    "accelerate>=1.15.0",
    "liger-kernel>=0.8.3",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

grpo = [
    "trl[vllm]>=1.16.0,<1.17",
    "vllm==0.30.0",
    "math-verify>=0.9.0",
    "absl-py==2.3.1",
    "immutabledict==4.2.2",
    "langdetect==1.0.9",
    "nltk==3.9.2",
]

dev = [
    "ruff>=0.16.9",
    "yamllint>=1.38.0",
]

notebooks = [
    "ipykernel",
    "jupyterlab",
    "pandas",
    "matplotlib",
    "seaborn",
]

[tool.uv]
conflicts = [
    [
        { group = "sft" },
        { group = "grpo" },
    ],
]

[tool.ruff]
extend-exclude = ["src/rlvr/_vendor"]
